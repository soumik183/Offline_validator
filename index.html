<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Offline Toolsuite — Multi-Format Encoder, Decoder, Hash & Utilities</title>
  <meta name="description" content="100% offline, privacy-first developer utility suite. Identifiers, cryptographic hashing, multi-format encoding/decoding, date/time, random generators, text tools, and format converters." />

  <!-- High-Quality Realistic Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />

  <!-- Prevent theme flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ov-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (_) {}
    })();
  </script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design system -->
  <link rel="stylesheet" href="css/style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen font-mono antialiased overflow-x-hidden">

  <!-- Minimalist Black & White Top Bar -->
  <nav class="nav-mono">
    <div class="max-w-3xl mx-auto px-3 sm:px-4">
      <div class="flex items-center justify-between h-12 sm:h-13">
        <a href="./" class="flex items-center gap-2 text-white hover:opacity-80 transition">
          <img src="assets/favicon.svg" alt="Offline Codec Logo" class="w-6 h-6 rounded-md shadow-sm" />
          <span class="font-bold text-xs sm:text-sm tracking-wider uppercase">OFFLINE CODEC</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Real-time Online / Offline status badge -->
          <div id="online-status" class="badge-mono !py-0.5 !px-2 text-[9px] sm:text-[10px]" title="Browser Network Connectivity">
            <span id="online-status-dot" class="w-1.5 h-1.5 rounded-full bg-white"></span>
            <span id="online-status-text" class="hidden xs:inline sm:inline">OFFLINE READY</span>
          </div>

          <!-- Black & White theme toggle button -->
          <button id="theme-toggle" class="btn-mono !py-0.5 !px-2 text-[10px] sm:text-xs uppercase" aria-label="Toggle theme">
            <span id="theme-text">LIGHT</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main App Container -->
  <main id="app"></main>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Scripts -->
  <script src="js/hash.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/fileio.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
