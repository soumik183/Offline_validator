<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Validator — Redirecting…</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%236366f1'/><path d='M9 12.5l2 2 4-4.5' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <script>
    // GitHub Pages SPA smart redirect to single page anchors
    (function () {
      var path = window.location.pathname;
      var targetHash = '';
      if (path.indexOf('hash') !== -1) targetHash = '#hash';
      else if (path.indexOf('history') !== -1) targetHash = '#history';
      else if (path.indexOf('about') !== -1) targetHash = '#about';
      else if (path.indexOf('validator') !== -1 || path.indexOf('dashboard') !== -1) targetHash = '#workbench';

      // Find repository path for GitHub Pages
      var segments = path.split('/').filter(Boolean);
      var basePath = './';
      if (segments.length > 0 && window.location.hostname.indexOf('github.io') !== -1) {
        basePath = '/' + segments[0] + '/';
      }
      window.location.replace(basePath + targetHash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
           text-align: center; padding: 2rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    p  { color: #94a3b8; margin: 0 0 1.5rem; }
    a  { color: #818cf8; text-decoration: none; border-bottom: 1px dashed currentColor; font-weight: 500; }
    a:hover { color: #c7d2fe; }
  </style>
</head>
<body>
  <div>
    <h1>Offline Validator</h1>
    <p>Redirecting to the single page app…</p>
    <p><a href="./">Click here if not redirected automatically →</a></p>
  </div>
</body>
</html>
