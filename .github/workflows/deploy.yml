name: Deploy to GitHub Pages

# Run on every push to main, and allow manual runs from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Grant the workflow the permissions it needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys — the latest push always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ship the whole repo (no build step — plain HTML/CSS/JS).
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
